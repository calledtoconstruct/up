; Polybar configuration for Up
; This file is auto-themed by switch-theme.sh
; Layout: [system-menu][workspaces] ... [status-modules]

[colors]
; These are replaced by switch-theme.sh
background = #1e1e2e
foreground = #cdd6f4
accent = #89b4fa
urgent = #f38ba8

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 24pt
radius = 0

; DPI scaling
dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt
line-color = ${colors.accent}

border-size = 0
padding = 1

font-0 = DejaVu Sans Mono:size=10;2
font-1 = Symbols Nerd Font:size=10;2

; Left modules (system menu + workspaces)
modules-left = system-menu i3

; Right modules (status)
modules-right = cpu memory filesystem network volume battery date

separator = |
separator-foreground = ${colors.accent}

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

[module/system-menu]
type = custom/text
format = "  "
content-foreground = ${colors.accent}
click-left = /usr/local/share/up/configs/scripts/system-menu.sh &

[module/i3]
type = internal/i3

; false: always show workspaces from i3 (avoids empty bar when MONITOR name
; does not match i3 output, common on VMs / multi-GPU / after theme restart).
pin-workspaces = false

; i3 workspaces are named "1".."10" — do not strip (would blank pure numbers
; when combined with name-based labels).
strip-wsnumbers = false
index-sort = true
enable-click = true
enable-scroll = true
wrapping-scroll = true

; Explicit tags so the module always renders workspace state
format = <label-state> <label-mode>
format-padding = 0

; %index% = workspace number; %name% matches i3 $wsN names ("1", "2", ...)
label-focused = %index%
label-focused-background = ${colors.accent}
label-focused-foreground = ${colors.background}
label-focused-padding = 2

label-unfocused = %index%
label-unfocused-foreground = ${colors.foreground}
label-unfocused-padding = 2

label-visible = %index%
label-visible-foreground = ${colors.foreground}
label-visible-padding = 2

label-urgent = %index%
label-urgent-background = ${colors.urgent}
label-urgent-foreground = ${colors.background}
label-urgent-padding = 2

label-mode = %mode%
label-mode-padding = 1
label-mode-background = ${colors.urgent}
label-mode-foreground = ${colors.background}

[module/cpu]
type = internal/cpu
interval = 5  ; Increased for older hardware
format = <label>
format-prefix = "󰓅  "
format-prefix-foreground = ${colors.accent}
label = %percentage:2%%
click-left = dex ~/.local/share/applications/system-monitor.desktop &

[module/memory]
type = internal/memory
interval = 5  ; Increased for older hardware
format = <label>
format-prefix = "  "
format-prefix-foreground = ${colors.accent}
label = %used%

[module/filesystem]
type = internal/fs
mount-0 = /
interval = 60  ; Increased for older hardware
format-mounted = <label-mounted>
format-mounted-prefix = " "
format-mounted-prefix-foreground = ${colors.accent}
label-mounted = %percentage_free%%
click-left = alacritty -e ncdu ~ &

[module/network]
type = internal/network
interface-type = wireless
interval = 10  ; Increased for older hardware
format-connected = <label-connected>
format-connected-prefix = " "
format-connected-prefix-foreground = ${colors.accent}
label-connected = %signal%%
format-disconnected = <label-disconnected>
format-disconnected-prefix = " "
format-disconnected-prefix-foreground = ${colors.urgent}
label-disconnected = "down"
click-left = dex ~/.local/share/applications/wifi-controls.desktop &

[module/volume]
type = internal/pulseaudio
format-volume = <label-volume>
format-volume-prefix = " "
format-volume-prefix-foreground = ${colors.accent}
label-volume = %percentage%%
format-muted = <label-muted>
format-muted-prefix = " "
format-muted-prefix-foreground = ${colors.urgent}
label-muted = Muted

[module/battery]
type = internal/battery
poll-interval = 30

battery = BAT0
adapter = AC0

format-charging = <label-charging>
format-charging-prefix = " "
format-charging-prefix-foreground = ${colors.accent}
label-charging = %percentage%%

format-discharging = <label-discharging>
format-discharging-prefix = " "
format-discharging-prefix-foreground = ${colors.accent}
label-discharging = %percentage%%

format-full = <label-full>
format-full-prefix = " "
format-full-prefix-foreground = ${colors.accent}
label-full = %percentage%%

; Low battery warning
label-low = ! %percentage%%
label-low-foreground = ${colors.urgent}

[module/date]
type = internal/date
interval = 15
date = %Y-%m-%d %H:%M
format = <label>
format-prefix = " "
format-prefix-foreground = ${colors.accent}
label = %date%

[settings]
screenchange-reload = true
pseudo-transparency = false

[global/wm]
margin-top = 0
margin-bottom = 0
