# Urban Nights Light Theme - Dawn haze over glass and wet streets
name = "Urban Nights Light"

# ===== STANDARD COLORS - Used by most applications =====
[colors]
background = "#F3F5FB"
foreground = "#1A1D2B"
accent = "#0891B2"
urgent = "#DB2777"
alternate = "#E8ECF6"
hover = "#D4D9EA"
active = "#4F46E5"

# Normal terminal colors (cool ink on pale city haze)
black = "#1A1D2B"
red = "#E11D48"
green = "#059669"
yellow = "#B45309"
blue = "#2563EB"
magenta = "#C026D3"
cyan = "#0891B2"
white = "#475569"

# Bright terminal colors
bright_black = "#475569"
bright_red = "#F43F5E"
bright_green = "#10B981"
bright_yellow = "#D97706"
bright_blue = "#3B82F6"
bright_magenta = "#D946EF"
bright_cyan = "#06B6D4"
bright_white = "#11131C"

# ===== APPLICATION-SPECIFIC COLORS =====

[i3]
bg = "#F3F5FB"
fg = "#1A1D2B"
accent = "#0891B2"
urgent = "#DB2777"

[alacritty]
primary_bg = "#F3F5FB"
primary_fg = "#1A1D2B"
cursor = "#0891B2"

[rofi]
background = "#F3F5FB"
foreground = "#1A1D2B"
selected = "#0891B2"
urgent = "#DB2777"
alternate = "#E8ECF6"
hover = "#D4D9EA"
active = "#4F46E5"

[picom]
shadow = "#000000"
shadow_alpha = "0.2"

# ===== GTK =====
[gtk]
# Custom theme - generated from colors
theme_name = "Urban-Nights-Light"
# No external package - generated from colors

# ===== BACKGROUND =====
[background]
# Custom backgrounds
directory = "../backgrounds/urban-nights/light"
fallback = "/usr/share/backgrounds/archlinux/sunset.jpg"

[nvim]
colorscheme = "custom"
