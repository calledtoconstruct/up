# Default picom theme fragment (overwritten by switch-theme.sh).
# Kept in-tree so @include "theme.conf" resolves before first theme apply.
# Theme: default
shadow = true;
shadow-color = "#000000";
shadow-opacity = 0.3;

fading = true;
fade-in-step = 0.028;
fade-out-step = 0.03;

blur: {
    method = "dual_kawase";
    strength = 4;
};
blur-background = true;

# Dim is set on the unfocused rule in rules.conf (not inactive-dim).
