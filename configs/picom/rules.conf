# Window rules (picom v12+). Included from config.
# switch-theme.sh rewrites dim from ~/.config/up/config (dim = true|false).
# Do not set global inactive-dim — picom warns and ignores it when rules exist.

rules: ({
    # Tooltips: light fade-less chrome
    match = "window_type = 'tooltip'";
    fade = false;
    shadow = true;
    opacity = 0.75;
    full-shadow = false;
}, {
    # Unfocused windows: slight transparency + optional dim
    match = "!focused && !fullscreen";
    opacity = 0.85;
    blur-background = true;
    dim = 0.15;  # up-inactive-dim
}, {
    # Fullscreen: solid, no rounding / shadow / blur / dim
    match = "fullscreen";
    opacity = 1.0;
    corner-radius = 0;
    shadow = false;
    blur-background = false;
    dim = 0.0;
}, {
    # Docks, desktop, and CSD extents: no blur / no rounded corners
    match = "window_type = 'dock'    || "
            "window_type = 'desktop' || "
            "_GTK_FRAME_EXTENTS@";
    blur-background = false;
    corner-radius = 0;
}, {
    # Panels / bars / notifications: no shadows or rounding
    match = "class_g = 'Polybar'     || "
            "class_g = 'i3bar'       || "
            "class_g = 'Rofi'        || "
            "class_g = 'Dunst'       || "
            "name = 'Notification'   || "
            "class_g = 'Conky'       || "
            "class_g ?= 'Notify-osd' || "
            "class_g = 'Cairo-clock' || "
            "_GTK_FRAME_EXTENTS@";
    shadow = false;
    corner-radius = 0;
}, {
    # Menus: keep solid and sharp
    match = "window_type = 'menu'          || "
            "window_type = 'dropdown_menu' || "
            "window_type = 'popup_menu'    || "
            "window_type = 'utility'";
    fade = false;
    shadow = false;
    opacity = 1.0;
    corner-radius = 0;
});
