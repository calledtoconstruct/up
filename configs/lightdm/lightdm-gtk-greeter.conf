# LightDM GTK Greeter Configuration for Up Linux
# Theme-aware login screen

[greeter]
# Theme settings (auto-updated by switch-theme.sh)
theme-name = Materia
icon-theme-name = Papirus-Dark
font-name = DejaVu Sans Mono 10

# Background (auto-updated by switch-theme.sh)
background = /usr/share/backgrounds/archlinux/geowaves.png

# Logo
logo = 

# User settings
default-user-image = 
hide-users = false
show-indicators = ~language;~session;~power
show-clock = true
clock-format = %H:%M

# Position
position = 50%,center 50%,center

# Accessibility
a11y-states = ~keyboard-accessible;~contrast