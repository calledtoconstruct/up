format = """
$username$hostname$directory$git_branch$git_status$cmd_duration$line_break$character
"""

[username]
show_always = true

# [directory]
# truncation_length = 3

[git_status]
style = "bold red"

[cmd_duration]
style = "bold yellow"

[line_break]
disabled = false

# ===== THEME COLORS =====
# Auto-generated by switch-theme.sh

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[✗](bold red)"

[directory]
style = "bold blue"

[git_branch]
style = "bold purple"

# ===== END THEME COLORS =====
